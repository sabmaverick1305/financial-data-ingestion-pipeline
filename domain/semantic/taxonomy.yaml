version: "1.0"
name: FIES Semantic Taxonomy
layer: 2
description: >
  Classification hierarchies over financial entities — fund scheme types,
  AMCs, document types, and named time periods. Pure structure (id, label,
  parent) — synonyms live in thesaurus.yaml, formal typed definitions live in
  financial_ontology.yaml. Consolidated from fies/ontology/entities.yaml's
  scheme_type parent pointers, which were the live, eval-verified hierarchy
  (a separate, redundant scheme_types tree in the old financial_ontology.yaml
  was never actually consumed by any code and is not carried forward).

# Fund scheme category hierarchy. `parent: all` marks a top-of-tree asset
# class; `parent: null` marks a standalone category that isn't nested under
# one of the four asset classes below.
scheme_types:
  - entity_id: equity
    label: Equity
    parent: all
  - entity_id: large_cap
    label: Large Cap
    parent: equity
  - entity_id: mid_cap
    label: Mid Cap
    parent: equity
  - entity_id: small_cap
    label: Small Cap
    parent: equity
  - entity_id: multi_cap
    label: Multi Cap
    parent: equity
  - entity_id: flexi_cap
    label: Flexi Cap
    parent: equity
  - entity_id: elss
    label: ELSS
    parent: equity
  - entity_id: sectoral_thematic
    label: Sectoral/Thematic
    parent: equity

  - entity_id: debt
    label: Debt
    parent: all
  - entity_id: liquid
    label: Liquid
    parent: debt
  - entity_id: overnight
    label: Overnight
    parent: debt
  - entity_id: gilt
    label: Gilt
    parent: debt

  - entity_id: hybrid
    label: Hybrid
    parent: all

  - entity_id: index_funds
    label: Index Funds
    parent: null
  - entity_id: etf
    label: ETF
    parent: null
  - entity_id: gold
    label: Gold
    parent: null
  - entity_id: international
    label: International
    parent: null

  - entity_id: all_categories
    label: All Categories
    parent: all

# ── mf_scheme_categories ─────────────────────────────────────────────────────
# A SEPARATE hierarchy for mf_scheme_master.category (per-scheme dataset,
# see mf_ingestion/) — deliberately NOT merged into scheme_types above.
# scheme_types maps to amfi_fund_stats.fund_category ("Large Cap Fund");
# mf_scheme_master.category follows SEBI's official scheme naming
# ("Equity Scheme - Large Cap Fund") — same real-world concepts, different
# literal column values in different tables. Keeping them apart avoids a
# synonym collision in thesaurus.yaml: both would want "large cap" as a
# synonym, and ontology_resolver.py's scheme_type resolution (used by the
# eval-verified amfi_fund_stats routing) has no notion of "which table" to
# disambiguate by. This taxonomy is consumed via
# semantic_engine.mf_scheme_category_ids/synonyms(), not the shared
# scheme_type_synonyms() path — currently used for Vanna training-doc
# generation (scripts/train_vanna.py), not live query routing.
mf_scheme_categories:
  - entity_id: equity_scheme
    label: Equity Scheme
    parent: null
  - entity_id: contra_fund_scheme
    label: Equity Scheme - Contra Fund
    parent: equity_scheme
    category_pattern: "%contra%"
  - entity_id: dividend_yield_scheme
    label: Equity Scheme - Dividend Yield Fund
    parent: equity_scheme
    category_pattern: "%dividend yield%"
  - entity_id: elss_scheme
    label: Equity Scheme - ELSS
    parent: equity_scheme
    category_pattern: "%elss%"
  - entity_id: flexi_cap_scheme
    label: Equity Scheme - Flexi Cap Fund
    parent: equity_scheme
    category_pattern: "%flexi cap%"
  - entity_id: focused_fund_scheme
    label: Equity Scheme - Focused Fund
    parent: equity_scheme
    category_pattern: "%focus%"
    note: Source data has both "Focused" and "Focussed" spellings — pattern matches either.
  - entity_id: large_cap_scheme
    label: Equity Scheme - Large Cap Fund
    parent: equity_scheme
    category_pattern: "%large cap%"
    note: Also matches "Large & Mid Cap Fund" — narrow to "%large cap fund%" if that's unwanted.
  - entity_id: large_and_mid_cap_scheme
    label: Equity Scheme - Large & Mid Cap Fund
    parent: equity_scheme
    category_pattern: "%large & mid%"
  - entity_id: mid_cap_scheme
    label: Equity Scheme - Mid Cap Fund
    parent: equity_scheme
    category_pattern: "%mid cap%"
    note: Also matches "Large & Mid Cap Fund" — narrow if that's unwanted.
  - entity_id: multi_cap_scheme
    label: Equity Scheme - Multi Cap Fund
    parent: equity_scheme
    category_pattern: "%multi cap%"
  - entity_id: sectoral_thematic_scheme
    label: Equity Scheme - Sectoral/ Thematic
    parent: equity_scheme
    category_pattern: "%sectoral%"
  - entity_id: small_cap_scheme
    label: Equity Scheme - Small Cap Fund
    parent: equity_scheme
    category_pattern: "%small cap%"
  - entity_id: micro_cap_scheme
    label: Equity Scheme - Micro Cap Fund
    parent: equity_scheme
    category_pattern: "%micro cap%"
    note: >
      AMFI has no separate "Micro Cap" SEBI category — it's a marketing/
      colloquial sub-segment of Small Cap. Kept as its own leaf rather than
      folded into small_cap_scheme's pattern, so it doesn't change that
      leaf's existing match behavior.
  - entity_id: mid_cap_nospace_scheme
    label: Equity Scheme - Mid Cap Fund (no-space spelling)
    parent: equity_scheme
    category_pattern: "%midcap%"
    note: >
      Added 2026-07-13 (DQ005 follow-up) — mid_cap_scheme's "%mid cap%"
      pattern requires a space; some legacy scheme names (e.g. "Sahara
      Midcap Fund") run the words together. Kept separate rather than
      widening mid_cap_scheme's pattern to avoid touching an already-correct
      leaf's match behavior.
  - entity_id: equity_opportunities_scheme
    label: Equity Scheme - Equity Opportunities Fund
    parent: equity_scheme
    category_pattern: "%equity opportunit%"
  - entity_id: equity_advantage_scheme
    label: Equity Scheme - Equity Advantage Fund
    parent: equity_scheme
    category_pattern: "%equity advantage%"
  - entity_id: banking_financial_services_sector_scheme
    label: Equity Scheme - Sectoral/Thematic (Banking & Financial Services)
    parent: equity_scheme
    category_pattern: "%banking%financial services%"
  - entity_id: value_fund_scheme
    label: Equity Scheme - Value Fund
    parent: equity_scheme
    category_pattern: "%value fund%"
  - entity_id: close_ended_equity_scheme
    label: Equity Scheme - Close Ended Equity Fund
    parent: equity_scheme
    category_pattern: "%close ended equity%"
    note: >
      Added 2026-07-13 (Phase 6 DQ005 investigation) — mfapi's category field
      is unreliable for close-ended series funds (often "Growth"/"Payout"/a
      plan name, not a real category), so this matches scheme_name via
      resolve_category's tier-3 fallback instead.

  - entity_id: debt_scheme
    label: Debt Scheme
    parent: null
  - entity_id: banking_psu_scheme
    label: Debt Scheme - Banking and PSU Fund
    parent: debt_scheme
    category_pattern: "%banking%psu%"
  - entity_id: corporate_bond_scheme
    label: Debt Scheme - Corporate Bond Fund
    parent: debt_scheme
    category_pattern: "%corporate bond%"
  - entity_id: credit_risk_scheme
    label: Debt Scheme - Credit Risk Fund
    parent: debt_scheme
    category_pattern: "%credit risk%"
  - entity_id: dynamic_bond_scheme
    label: Debt Scheme - Dynamic Bond
    parent: debt_scheme
    category_pattern: "%dynamic bond%"
  - entity_id: floater_scheme
    label: Debt Scheme - Floater Fund
    parent: debt_scheme
    category_pattern: "%floater%"
  - entity_id: gilt_scheme
    label: Debt Scheme - Gilt Fund
    parent: debt_scheme
    category_pattern: "%gilt%"
    note: Also matches "Gilt Fund with 10 year constant duration".
  - entity_id: liquid_scheme
    label: Debt Scheme - Liquid Fund
    parent: debt_scheme
    category_pattern: "%liquid%"
  - entity_id: long_duration_scheme
    label: Debt Scheme - Long Duration Fund
    parent: debt_scheme
    category_pattern: "%long duration%"
    note: Also matches "Medium to Long Duration Fund" — narrow to "^long duration" if unwanted.
  - entity_id: low_duration_scheme
    label: Debt Scheme - Low Duration Fund
    parent: debt_scheme
    category_pattern: "%low duration%"
  - entity_id: medium_duration_scheme
    label: Debt Scheme - Medium Duration Fund
    parent: debt_scheme
    category_pattern: "%medium duration%"
    note: Also matches "Medium to Long Duration Fund" — narrow if unwanted.
  - entity_id: medium_to_long_duration_scheme
    label: Debt Scheme - Medium to Long Duration Fund
    parent: debt_scheme
    category_pattern: "%medium to long%"
  - entity_id: money_market_scheme
    label: Debt Scheme - Money Market Fund
    parent: debt_scheme
    category_pattern: "%money market%"
  - entity_id: overnight_scheme
    label: Debt Scheme - Overnight Fund
    parent: debt_scheme
    category_pattern: "%overnight%"
  - entity_id: short_duration_scheme
    label: Debt Scheme - Short Duration Fund
    parent: debt_scheme
    category_pattern: "%short duration%"
  - entity_id: ultra_short_duration_scheme
    label: Debt Scheme - Ultra Short Duration Fund
    parent: debt_scheme
    category_pattern: "%ultra short%"
  - entity_id: fixed_maturity_plan_scheme
    label: Debt Scheme - Fixed Maturity Plan (FMP)
    parent: debt_scheme
    category_pattern: "%fixed maturity%"
    note: >
      Close-ended debt series funds — see close_ended_equity_scheme's note.
      Covers "Fixed Maturity Plan"/"Fixed Maturity Fund" scheme names.
  - entity_id: fixed_term_income_fund_scheme
    label: Debt Scheme - Fixed Term Income Fund (FTIF)
    parent: debt_scheme
    category_pattern: "%ftif%"
  - entity_id: fixed_duration_fund_scheme
    label: Debt Scheme - Fixed Duration Fund
    parent: debt_scheme
    category_pattern: "%fixed duration%"
  - entity_id: close_ended_debt_series_scheme
    label: Debt Scheme - Close Ended Debt Fund Series
    parent: debt_scheme
    category_pattern: "%debt fund series%"
  - entity_id: fmp_series_scheme
    label: Debt Scheme - FMP Series
    parent: debt_scheme
    category_pattern: "%fmp%"
  - entity_id: interval_scheme
    label: Debt Scheme - Interval Fund
    parent: debt_scheme
    category_pattern: "%interval fund%"
  - entity_id: fixed_term_plan_scheme
    label: Debt Scheme - Fixed Term Plan
    parent: debt_scheme
    category_pattern: "%fixed term plan%"
    note: >
      Added 2026-07-13 (DQ005 follow-up, second pass on remaining 375
      schemes) — distinct from fixed_maturity_plan_scheme/
      fixed_duration_fund_scheme because "Fixed Term Plan/Series" is the
      literal wording AMCs (Axis, Sundaram, HSBC) use for this same
      close-ended debt product family. Deliberately does NOT match "Hybrid
      Fixed Term Fund" names (see hybrid_fixed_term_scheme below) since
      those lack "plan"/"series" immediately after "term".
  - entity_id: fixed_term_series_scheme
    label: Debt Scheme - Fixed Term Series
    parent: debt_scheme
    category_pattern: "%fixed term series%"
  - entity_id: fixed_horizon_fund_scheme
    label: Debt Scheme - Fixed Horizon Fund
    parent: debt_scheme
    category_pattern: "%fixed horizon%"
  - entity_id: fixed_tenure_fund_scheme
    label: Debt Scheme - Fixed Tenure Fund
    parent: debt_scheme
    category_pattern: "%fixed tenure%"
  - entity_id: debt_fund_series_alt_scheme
    label: Debt Scheme - Debt Fund(s) Series (alt spelling)
    parent: debt_scheme
    category_pattern: "%debt fund%series%"
    note: >
      Multi-wildcard variant of close_ended_debt_series_scheme's "%debt fund
      series%" — that pattern requires the literal singular "fund series"
      substring, which the plural "SBI DEBT FUNDS SERIES A" narrowly misses
      (funds != fund followed by a space). Kept as a separate leaf rather
      than editing the original pattern, to avoid touching a leaf that's
      already matching correctly elsewhere.
  - entity_id: sdfs_scheme
    label: Debt Scheme - Structured/Short Debt Fund Series (SDFS)
    parent: debt_scheme
    category_pattern: "%sdfs%"
    note: SBI's own abbreviation for its close-ended debt fund series (e.g. "SBI SDFS 367 DAYS - 1").
  - entity_id: cash_fund_scheme
    label: Debt Scheme - Cash Fund (legacy Liquid Fund naming)
    parent: debt_scheme
    category_pattern: "%cash fund%"
    note: Pre-2017 SEBI recategorization naming for what are now Liquid Funds.
  - entity_id: flexi_debt_scheme
    label: Debt Scheme - Flexi Debt Fund
    parent: debt_scheme
    category_pattern: "%flexi%debt%"
  - entity_id: g_sec_scheme
    label: Debt Scheme - Gilt / G-Sec Fund
    parent: debt_scheme
    category_pattern: "%g-sec%"
    note: >
      Alias for gilt_scheme's concept — "G-Sec" (Government Securities) is
      the colloquial abbreviation some AMCs (e.g. UTI) use in place of the
      word "Gilt", which gilt_scheme's own pattern requires literally.
  - entity_id: money_manager_fund_scheme
    label: Debt Scheme - Money Manager Fund
    parent: debt_scheme
    category_pattern: "%money manager%"
    note: IDFC's product name for what money_market_scheme's "%money market%" pattern doesn't reach.
  - entity_id: fixed_maturity_plan_typo_scheme
    label: Debt Scheme - Fixed Maturity Plan (typo alias)
    parent: debt_scheme
    category_pattern: "%fixed matuirty%"
    note: >
      Added 2026-07-13 (DQ005 third pass) — literal misspelling ("Matuirty"
      for "Maturity") present in real scheme names (DHFL Pramerica, Tata).
      Kept as a separate leaf from fixed_maturity_plan_scheme rather than
      editing that pattern, same rationale as the other alias leaves above.
  - entity_id: fixed_duration_fund_typo_scheme
    label: Debt Scheme - Fixed Duration Fund (typo alias)
    parent: debt_scheme
    category_pattern: "%fixed duartion%"
    note: Literal misspelling ("Duartion" for "Duration") present in real PGIM India scheme names.
  - entity_id: debt_fund_series_typo_scheme
    label: Debt Scheme - Debt Fund Series (typo alias, missing "d")
    parent: debt_scheme
    category_pattern: "%debt funs series%"
    note: Literal misspelling ("Funs" for "Fund(s)") present in real SBI scheme names.
  - entity_id: savings_fund_scheme
    label: Debt Scheme - Savings Fund
    parent: debt_scheme
    category_pattern: "%savings fund%"
    note: >
      Generic debt-product naming (Sundaram/Mirae Asset/Indiabulls Savings
      Fund) — distinct from equity_savings_scheme, which requires the
      literal word "equity" and is a real hybrid sub-category (RGESS-style
      schemes), not this plain debt product name.
  - entity_id: short_term_fund_scheme
    label: Debt Scheme - Short Term Fund
    parent: debt_scheme
    category_pattern: "%short term fund%"
    note: Older naming for what's roughly equivalent to today's Short Duration Fund.
  - entity_id: money_fund_scheme
    label: Debt Scheme - Money Fund
    parent: debt_scheme
    category_pattern: "%money fund%"
    note: Generic debt/money-market product naming (e.g. "Sundaram Money Fund").
  - entity_id: debt_generic_bond_scheme
    label: Debt Scheme - Unspecified Bond Fund
    parent: debt_scheme
    category_pattern: "%bond%"
    note: >
      Added 2026-07-13 (DQ005 third pass) as the last leaf checked in this
      section — mirrors hybrid_generic_scheme's role: a broad catch-all for
      names that literally say "Bond" (e.g. "Kotak Bond Bonus Plan",
      "Sundaram Medium Term Bond Fund") but don't match any more specific
      debt pattern above. Every more specific debt_scheme pattern is tried
      first by file order, and no hybrid_scheme pattern requires the word
      "bond", so this can't steal a hybrid match.

  - entity_id: hybrid_scheme
    label: Hybrid Scheme
    parent: null
  - entity_id: aggressive_hybrid_scheme
    label: Hybrid Scheme - Aggressive Hybrid Fund
    parent: hybrid_scheme
    category_pattern: "%aggressive hybrid%"
  - entity_id: arbitrage_scheme
    label: Hybrid Scheme - Arbitrage Fund
    parent: hybrid_scheme
    category_pattern: "%arbitrage%"
  - entity_id: balanced_hybrid_scheme
    label: Hybrid Scheme - Balanced Hybrid Fund
    parent: hybrid_scheme
    category_pattern: "%balanced hybrid%"
  - entity_id: conservative_hybrid_scheme
    label: Hybrid Scheme - Conservative Hybrid Fund
    parent: hybrid_scheme
    category_pattern: "%conservative hybrid%"
  - entity_id: dynamic_asset_allocation_scheme
    label: Hybrid Scheme - Dynamic Asset Allocation or Balanced Advantage
    parent: hybrid_scheme
    category_pattern: "%balanced advantage%"
  - entity_id: equity_savings_scheme
    label: Hybrid Scheme - Equity Savings
    parent: hybrid_scheme
    category_pattern: "%equity saving%"
    note: >
      Widened from "%equity savings%" 2026-07-13 (Phase 6 DQ005 follow-up) to
      also match "Equity Saving Scheme" (singular, e.g. the RGESS family) —
      purely additive, matches a strict superset of the original pattern.
  - entity_id: multi_asset_allocation_scheme
    label: Hybrid Scheme - Multi Asset Allocation
    parent: hybrid_scheme
    category_pattern: "%multi asset%"
  - entity_id: capital_protection_scheme
    label: Hybrid Scheme - Capital Protection Oriented Fund
    parent: hybrid_scheme
    category_pattern: "%capital protection%"
  - entity_id: dual_advantage_scheme
    label: Hybrid Scheme - Dual Advantage Fund
    parent: hybrid_scheme
    category_pattern: "%dual advantage%"
  - entity_id: dual_advantage_typo_scheme
    label: Hybrid Scheme - Dual Advantage Fund (typo alias)
    parent: hybrid_scheme
    category_pattern: "%dual advanatge%"
    note: Literal misspelling ("Advanatge" for "Advantage") present in a real SBI scheme name.
  - entity_id: hybrid_fixed_term_scheme
    label: Hybrid Scheme - Hybrid Fixed Term Fund
    parent: hybrid_scheme
    category_pattern: "%hybrid fixed term%"
    note: >
      Added 2026-07-13 (DQ005 follow-up) — DHFL Pramerica/PGIM's close-ended
      hybrid debt+equity series funds literally say "Hybrid Fixed Term
      Fund"/"Fund" in the scheme name. Placed before the generic hybrid_
      generic_scheme catch-all below so it wins; also checked before any
      debt_scheme "fixed term" pattern could apply since none of those
      require the literal word "hybrid".
  - entity_id: hybrid_fixed_term_typo_scheme
    label: Hybrid Scheme - Hybrid Fixed Term Fund (typo alias)
    parent: hybrid_scheme
    category_pattern: "%hybird fixed term%"
    note: Literal misspelling ("Hybird" for "Hybrid") present in a real DHFL Pramerica scheme name.
  - entity_id: debt_oriented_hybrid_scheme
    label: Hybrid Scheme - Debt Oriented Hybrid Fund
    parent: hybrid_scheme
    category_pattern: "%debt oriented%"
    note: Pre-2017 SEBI naming, roughly equivalent to today's Conservative Hybrid Fund.
  - entity_id: capital_protection_cpo_abbrev_scheme
    label: Hybrid Scheme - Capital Protection Oriented Fund (CPO abbreviation)
    parent: hybrid_scheme
    category_pattern: "%cpo -%"
    note: Covers "HDFC CPO - I/II/III - ..." naming that capital_protection_scheme's "%capital protection%" pattern doesn't reach.
  - entity_id: capital_protection_cpof_scheme
    label: Hybrid Scheme - Capital Protection Oriented Fund (CPOF abbreviation)
    parent: hybrid_scheme
    category_pattern: "%cpof%"
    note: Covers "Sundaram CPOF ..." naming.
  - entity_id: hybrid_generic_scheme
    label: Hybrid Scheme - Unspecified Hybrid Fund
    parent: hybrid_scheme
    category_pattern: "%hybrid%"
    note: >
      Added 2026-07-13 (DQ005 follow-up) as the last leaf checked in this
      section — a broad catch-all for scheme names that literally contain
      "Hybrid" (SEBI's own top-level category word) but don't match any of
      the more specific hybrid sub-patterns above (e.g. "Axis Hybrid Fund -
      Series 18", "Sundaram Hybrid Series N"). Every more specific
      debt_scheme/hybrid_scheme pattern is tried first by file order, so
      this only fires when nothing narrower matched.

  - entity_id: other_scheme
    label: Other Scheme
    parent: null
  - entity_id: fof_domestic_scheme
    label: Other Scheme - FoF Domestic
    parent: other_scheme
    category_pattern: "%fof domestic%"
  - entity_id: fof_overseas_scheme
    label: Other Scheme - FoF Overseas
    parent: other_scheme
    category_pattern: "%fof overseas%"
  - entity_id: gold_etf_scheme
    label: Other Scheme - Gold ETF
    parent: other_scheme
    category_pattern: "%gold etf%"
  - entity_id: equity_etf_scheme
    label: Other Scheme - Equity ETF
    parent: other_scheme
    category_pattern: "%equity%etf%"
    note: >
      Added after finding AMFI's own NAVAll.txt category headers use
      "Exchange Traded Funds (ETFs) - Equity ETF" — a phrasing
      other_etfs_scheme's "%other%etf%" pattern doesn't catch.
  - entity_id: debt_etf_scheme
    label: Other Scheme - Debt ETF
    parent: other_scheme
    category_pattern: "%debt%etf%"
    note: "Same AMFI NAVAll.txt phrasing gap as equity_etf_scheme, for the Debt ETF sub-category."
  - entity_id: index_funds_scheme
    label: Other Scheme - Index Funds
    parent: other_scheme
    category_pattern: "%index fund%"
  - entity_id: other_etfs_scheme
    label: Other Scheme - Other ETFs
    parent: other_scheme
    category_pattern: "%other%etf%"
  - entity_id: solution_oriented_scheme
    label: Solution Oriented Scheme
    parent: null
  - entity_id: retirement_fund_scheme
    label: Solution Oriented Scheme - Retirement Fund
    parent: solution_oriented_scheme
    category_pattern: "%retirement%"
  - entity_id: childrens_fund_scheme
    label: Solution Oriented Scheme - Children's Fund
    parent: solution_oriented_scheme
    category_pattern: "%children%"
  - entity_id: income_scheme
    label: Debt Scheme - Income
    parent: debt_scheme
    category_pattern: "%income%"
    note: >
      "Income" is AMFI's own real (not corrupted) legacy/generic category
      header — checked against a real NAVAll.txt: it covers close-ended
      Fixed Maturity Plans, Interval Funds, and older open-ended schemes
      that predate SEBI's 2017 debt-scheme sub-category reform (Liquid/
      Overnight/Low Duration/etc. don't cleanly apply to fixed-maturity or
      interval products). Deliberately placed LAST in this file — its
      "%income%" pattern is broad enough that it must only be checked after
      every more specific debt pattern (liquid_scheme, overnight_scheme,
      etc.) has already had a chance, since e.g. "Income/Debt Oriented
      Schemes - Liquid Fund" should resolve to liquid_scheme, not here.
      Matching is first-match-wins in file order (see
      services/entity_resolver.py's resolve_category()) — moving this
      entry earlier would silently break that.

