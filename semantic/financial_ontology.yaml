version: "1.0"
name: FIES Financial Ontology
layer: 4
description: >
  Formal typed definitions over vocabulary.yaml and taxonomy.yaml concepts.
  Every concept gets a `type` (FinancialMetric, FundCategory,
  AssetManagementCompany, DocumentType) and a prose `definition` usable
  directly as a RAG answer for "What is X?" queries — plus the structural
  metadata (sql_column, aggregation rules, template-family constraints) the
  retrieval/generation/eval-generation code actually consumes. This is the
  layer that turns "these ids exist" (vocabulary/taxonomy) and "these ids
  mean the same thing" (thesaurus) into "here is what this id IS."

# ─────────────────────────────────────────────────────────────────────────
# FinancialMetric concepts
# ─────────────────────────────────────────────────────────────────────────
concepts:
  aum:
    type: FinancialMetric
    canonical_name: Assets Under Management
    definition: >
      Assets Under Management — the total market value of assets a fund,
      category, or AMC manages at a specific point in time.
    semantic_type: stock
    unit: crore_inr
    sql_column: aum
    preferred_tables: [amfi_fund_stats, amfi_amc_stats]
    default_aggregation: latest
    valid_aggregations: [latest, avg, max, min, trend, yoy_change, mom_change]
    disallowed_template_families: [sum_over_range]
    temporal_rule: >
      AUM is a point-in-time stock metric. Use latest/snapshot unless the
      user explicitly asks for average, growth, trend, max, min, or a
      time-series.

  avg_aum:
    type: FinancialMetric
    canonical_name: Average AUM
    definition: >
      Average Assets Under Management — the average AUM for a stated
      reporting period, usually a month or quarter, as a distinct reported
      column rather than an average computed over multiple periods.
    semantic_type: period_average
    unit: crore_inr
    sql_column: avg_aum
    preferred_tables: [amfi_fund_stats, amfi_amc_stats]
    default_aggregation: avg
    valid_aggregations: [latest, snapshot, avg, trend]
    disallowed_template_families: [sum_over_range, cumulative_range]
    note: >
      Do not substitute avg_aum into range-sum templates. "Average AUM from
      2020 to 2025" means AVG(aum) over periods, not the avg_aum column,
      unless the query is about a single stated period.

  funds_mobilized:
    type: FinancialMetric
    canonical_name: Funds Mobilized
    definition: >
      Funds Mobilized — the gross amount invested or subscribed into
      mutual fund schemes during a period, before any redemptions are
      subtracted.
    semantic_type: flow
    unit: crore_inr
    sql_column: funds_mobilized
    preferred_tables: [amfi_fund_stats, amfi_monthly_category_stats]
    default_aggregation: sum
    valid_aggregations: [sum, avg, max, min, trend, yoy_change, mom_change]
    disallowed_template_families: []

  redemption:
    type: FinancialMetric
    canonical_name: Redemption
    definition: >
      Redemption — the gross amount withdrawn or redeemed from mutual fund
      schemes during a period.
    semantic_type: flow
    unit: crore_inr
    sql_column: redemption
    preferred_tables: [amfi_fund_stats, amfi_monthly_category_stats]
    default_aggregation: sum
    valid_aggregations: [sum, avg, max, min, trend, yoy_change, mom_change]
    disallowed_template_families: []

  net_inflow:
    type: FinancialMetric
    canonical_name: Net Inflow
    definition: >
      Net Inflow — the net flow into a scheme or category after subtracting
      redemption from funds mobilized during the same period.
    semantic_type: derived_flow
    unit: crore_inr
    sql_column: net_inflow
    preferred_tables: [amfi_fund_stats, amfi_monthly_category_stats]
    default_aggregation: sum
    valid_aggregations: [sum, avg, max, min, trend, yoy_change, mom_change]
    disallowed_template_families: []
    formula: funds_mobilized - redemption
    component_metrics: [funds_mobilized, redemption]

  folios:
    type: FinancialMetric
    canonical_name: Number of Folios
    definition: >
      Number of Folios — the count of investor folio/account records for a
      scheme, category, or AMC. A proxy for investor participation, not a
      count of unique investors.
    semantic_type: stock_count
    unit: count
    sql_column: no_of_folios
    preferred_tables: [amfi_fund_stats]
    default_aggregation: latest
    valid_aggregations: [latest, avg, max, min, trend, yoy_change, mom_change]
    disallowed_template_families: [sum_over_range]
    semantic_warning: Folios are not identical to unique investors; phrase answers carefully.

  schemes:
    type: FinancialMetric
    canonical_name: Number of Schemes
    definition: >
      Number of Schemes — the count of active mutual fund schemes in a
      category, AMC, or reporting period.
    semantic_type: stock_count
    unit: count
    sql_column: no_of_schemes
    preferred_tables: [amfi_fund_stats]
    default_aggregation: latest
    valid_aggregations: [latest, count, max, min, trend]
    disallowed_template_families: [sum_over_range, cumulative_range]

  # ───────────────────────────────────────────────────────────────────────
  # Per-scheme concepts — mf_scheme_master / mf_nav_history /
  # mf_scheme_performance (mfapi.in, see mf_ingestion/, mf_performance/).
  # A distinct dataset from amfi_fund_stats above: identified by
  # scheme_code, not fund_category/period_year/period_month.
  # ───────────────────────────────────────────────────────────────────────
  scheme_code:
    type: Identifier
    canonical_name: Scheme Code
    definition: >
      Scheme Code — the unique mfapi.in identifier for a specific mutual
      fund scheme. Growth, dividend, direct, and regular plans of the same
      fund each have their own distinct scheme_code.
    semantic_type: identifier
    sql_column: scheme_code
    preferred_tables: [mf_scheme_master, mf_nav_history, mf_scheme_performance]
    default_aggregation: none
    valid_aggregations: [none]
    disallowed_template_families: [sum_over_range, trend]

  scheme_name:
    type: Identifier
    canonical_name: Scheme Name
    definition: >
      Scheme Name — the full published name of a mutual fund scheme,
      including its plan/option variant (e.g. "HDFC Top 100 Fund - Direct
      Plan - Growth").
    semantic_type: identifier
    sql_column: scheme_name
    preferred_tables: [mf_scheme_master]
    default_aggregation: none
    valid_aggregations: [none]
    disallowed_template_families: [sum_over_range, trend]

  amc_name:
    type: Identifier
    canonical_name: AMC Name
    definition: >
      AMC Name — the Asset Management Company that sponsors and manages a
      mutual fund scheme (e.g. "HDFC Mutual Fund"), as reported by
      mfapi.in for that specific scheme.
    semantic_type: identifier
    sql_column: amc_name
    preferred_tables: [mf_scheme_master]
    default_aggregation: none
    valid_aggregations: [none]
    disallowed_template_families: [sum_over_range, trend]

  nav:
    type: FinancialMetric
    canonical_name: Net Asset Value
    definition: >
      Net Asset Value (NAV) — the per-unit market value of a mutual fund
      scheme on a given date, published daily by mfapi.in and stored one
      row per (scheme_code, nav_date) in mf_nav_history.
    semantic_type: stock
    unit: inr
    sql_column: nav
    preferred_tables: [mf_nav_history]
    default_aggregation: latest
    valid_aggregations: [latest, max, min, trend]
    disallowed_template_families: [sum_over_range]
    temporal_rule: >
      NAV is a daily point-in-time value in mf_nav_history, keyed by
      nav_date. For "the NAV" / "current NAV" with no date given, prefer
      latest_nav from mf_scheme_performance — it is precomputed and avoids
      scanning the full history.

  latest_nav:
    type: FinancialMetric
    canonical_name: Latest NAV
    definition: >
      Latest NAV — the most recently published per-unit NAV for a scheme,
      precomputed in mf_scheme_performance alongside its date
      (latest_nav_date).
    semantic_type: stock
    unit: inr
    sql_column: latest_nav
    preferred_tables: [mf_scheme_performance]
    default_aggregation: latest
    valid_aggregations: [latest]
    disallowed_template_families: [sum_over_range, trend]

  return_1m:
    type: FinancialMetric
    canonical_name: 1-Month Return
    definition: >
      1-Month Return — the simple percentage change in NAV over the
      trailing 1 month: ((latest_nav / nav_1_month_ago) - 1) * 100.
    semantic_type: return
    unit: percent
    sql_column: return_1m
    preferred_tables: [mf_scheme_performance]
    default_aggregation: latest
    valid_aggregations: [latest]
    disallowed_template_families: [sum_over_range, trend]

  return_3m:
    type: FinancialMetric
    canonical_name: 3-Month Return
    definition: >
      3-Month Return — the simple percentage change in NAV over the
      trailing 3 months: ((latest_nav / nav_3_months_ago) - 1) * 100.
    semantic_type: return
    unit: percent
    sql_column: return_3m
    preferred_tables: [mf_scheme_performance]
    default_aggregation: latest
    valid_aggregations: [latest]
    disallowed_template_families: [sum_over_range, trend]

  return_6m:
    type: FinancialMetric
    canonical_name: 6-Month Return
    definition: >
      6-Month Return — the simple percentage change in NAV over the
      trailing 6 months: ((latest_nav / nav_6_months_ago) - 1) * 100.
    semantic_type: return
    unit: percent
    sql_column: return_6m
    preferred_tables: [mf_scheme_performance]
    default_aggregation: latest
    valid_aggregations: [latest]
    disallowed_template_families: [sum_over_range, trend]

  return_1y:
    type: FinancialMetric
    canonical_name: 1-Year Return
    definition: >
      1-Year Return — the simple percentage change in NAV over the
      trailing 1 year: ((latest_nav / nav_1_year_ago) - 1) * 100.
    semantic_type: return
    unit: percent
    sql_column: return_1y
    preferred_tables: [mf_scheme_performance]
    default_aggregation: latest
    valid_aggregations: [latest]
    disallowed_template_families: [sum_over_range, trend]

  return_3y_cagr:
    type: FinancialMetric
    canonical_name: 3-Year CAGR
    definition: >
      3-Year CAGR — the compound annual growth rate of NAV over the
      trailing 3 years: ((latest_nav / nav_3_years_ago) ^ (1/3) - 1) * 100.
    semantic_type: cagr
    unit: percent
    sql_column: return_3y_cagr
    preferred_tables: [mf_scheme_performance]
    default_aggregation: latest
    valid_aggregations: [latest]
    disallowed_template_families: [sum_over_range, trend]
    note: >
      CAGR, not a simple return — do not confuse with return_1y. Formula
      uses a fractional exponent (1/3), not a linear percentage change.

  return_5y_cagr:
    type: FinancialMetric
    canonical_name: 5-Year CAGR
    definition: >
      5-Year CAGR — the compound annual growth rate of NAV over the
      trailing 5 years: ((latest_nav / nav_5_years_ago) ^ (1/5) - 1) * 100.
    semantic_type: cagr
    unit: percent
    sql_column: return_5y_cagr
    preferred_tables: [mf_scheme_performance]
    default_aggregation: latest
    valid_aggregations: [latest]
    disallowed_template_families: [sum_over_range, trend]
    note: >
      CAGR, not a simple return — formula uses a fractional exponent (1/5).

  since_launch_return:
    type: FinancialMetric
    canonical_name: Since Launch Return
    definition: >
      Since Launch Return — the simple percentage change in NAV from a
      scheme's earliest available NAV to its latest NAV. Stored as
      all_time_return in mf_scheme_performance (mf_ingestion only has NAV
      history back to 2000-01-01, so for funds launched before then this
      reflects "since 2000" rather than the true launch date).
    semantic_type: return
    unit: percent
    sql_column: all_time_return
    preferred_tables: [mf_scheme_performance]
    default_aggregation: latest
    valid_aggregations: [latest]
    disallowed_template_families: [sum_over_range, trend]

  # ───────────────────────────────────────────────────────────────────────
  # FundCategory concepts — brief defining prose per scheme type. Hierarchy
  # (parent/children) lives in taxonomy.yaml; this only adds the definition.
  # ───────────────────────────────────────────────────────────────────────
  equity:
    type: FundCategory
    definition: Mutual fund schemes that invest predominantly in listed equity shares, targeting capital growth.
  large_cap:
    type: FundCategory
    definition: Equity funds investing predominantly in the largest listed companies by market capitalization.
  mid_cap:
    type: FundCategory
    definition: Equity funds investing predominantly in mid-sized listed companies by market capitalization.
  small_cap:
    type: FundCategory
    definition: Equity funds investing predominantly in smaller listed companies by market capitalization.
  multi_cap:
    type: FundCategory
    definition: Equity funds investing across large-cap, mid-cap, and small-cap companies without a fixed allocation bias.
  flexi_cap:
    type: FundCategory
    definition: Equity funds with full flexibility to invest across market capitalizations based on the fund manager's view.
  elss:
    type: FundCategory
    definition: >
      Equity Linked Savings Scheme — an equity fund category offering tax
      deduction under Section 80C, subject to a mandatory 3-year lock-in.
  sectoral_thematic:
    type: FundCategory
    definition: Equity funds concentrated in a specific sector (e.g. banking, IT) or investment theme.
  debt:
    type: FundCategory
    definition: Mutual fund schemes investing predominantly in fixed-income instruments such as bonds and money market securities.
  liquid:
    type: FundCategory
    definition: Debt funds investing in short-maturity money market instruments, typically up to 91 days.
  overnight:
    type: FundCategory
    definition: Debt funds investing in securities maturing in exactly one day, the lowest-duration-risk debt category.
  gilt:
    type: FundCategory
    definition: Debt funds investing predominantly in government securities.
  hybrid:
    type: FundCategory
    definition: Mutual fund schemes investing in a mix of equity and debt instruments to balance growth and stability.
  index_funds:
    type: FundCategory
    definition: Passively managed funds that replicate the composition of a specified market index.
  etf:
    type: FundCategory
    definition: Exchange Traded Fund — a passively managed, index-tracking fund that trades on a stock exchange like a share.
  gold:
    type: FundCategory
    definition: Funds investing in gold or gold-related instruments, including Gold ETFs, as a store-of-value / hedge allocation.
  international:
    type: FundCategory
    definition: Funds investing predominantly in securities listed outside India.
  all_categories:
    type: FundCategory
    definition: Represents the entire mutual fund industry across all scheme categories combined — used when a query has no category filter.

