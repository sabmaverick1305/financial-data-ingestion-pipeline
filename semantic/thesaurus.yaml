# Display-token overrides: some taxonomy entities don't map 1:1 onto a single
# surface token when producing intent.scheme_types-style output. Reverse-
# engineered from the hand-authored eval corpus's actual conventions.
scheme_type_display_overrides:
  sectoral_thematic: [sectoral, thematic]
  all_categories: []

