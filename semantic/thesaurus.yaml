version: "1.0"
name: FIES Semantic Thesaurus
layer: 3
description: >
  Synonym resolution for every term registered in vocabulary.yaml (metrics)
  and taxonomy.yaml (scheme_types, amcs). Every synonym list here must
  resolve to a term_id/entity_id that actually exists in those two files —
  enforced by semantic_engine.py's cross-validation. Negative synonyms and
  disambiguation rules exist because financial terminology genuinely
  overlaps ("inflow" alone is ambiguous between gross funds_mobilized and
  net_inflow) — see disambiguation_rules below.

metric_synonyms:
  aum:
    synonyms:
      - aum
      - assets under management
      - asset under management
      - corpus
      - asset base
      - managed assets
      - fund corpus
      - assets managed
      - total assets
      - fund size
    negative_synonyms: []
  avg_aum:
    synonyms:
      - aaum
      - avg aum
      - average assets
      - average corpus
      - average asset base
      - monthly average aum
      - average assets under management
    negative_synonyms: []
  funds_mobilized:
    synonyms:
      - funds mobilized
      - amount invested
      - money invested
      - capital invested
      - gross inflow
      - gross subscriptions
      - subscriptions
      - money came in
      - capital mobilized
      - funds collected
      - investment received
      - mobilization
      - mobilised amount
      - funds mobilised
    negative_synonyms:
      - net inflow
      - aum
      - redemption
      - withdrawal
  redemption:
    synonyms:
      - redemption
      - withdrawal
      - outflow
      - redeemed amount
      - money withdrawn
      - capital withdrawn
      - redemptions
      - funds redeemed
      - investor withdrawals
    negative_synonyms:
      - funds mobilized
      - net inflow
      - aum
  net_inflow:
    synonyms:
      - net inflow
      - net investment
      - net subscription
      - net money came in
      - net flow
      - net inflows
      - net capital inflow
      - net addition
    negative_synonyms: []
    ambiguous_terms:
      - inflow
  folios:
    synonyms:
      - number of folios
      - no of folios
      - folios
      - investors
      - investor count
      - accounts
      - folio count
      - number of investors
      - investor accounts
    negative_synonyms: []
    semantic_warning: Folios are not identical to unique investors; phrase answer carefully.
  schemes:
    synonyms:
      - number of schemes
      - no of schemes
      - schemes
      - fund schemes
      - products
      - fund products
      - mutual fund products
    negative_synonyms: []

# Disambiguation between metrics whose synonym sets can overlap on a bare word.
disambiguation_rules:
  - condition: query contains gross, total invested, mobilized, or subscriptions
    prefer: funds_mobilized
  - condition: query contains net, after redemption, or net flow
    prefer: net_inflow

