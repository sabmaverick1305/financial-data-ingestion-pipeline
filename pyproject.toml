[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-data-ingestion-pipeline"
version = "0.1.0"
description = "A pipeline for ingesting and processing financial data"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "tenacity>=8.3",
    "schedule>=1.2",
    "click>=8.1",
    "boto3>=1.34",
    "pyarrow>=16.0",
    "pymupdf>=1.24",
    "docling>=2.0",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "psycopg2-binary>=2.9",
    "sentence-transformers>=3.0",   # all-MiniLM-L6-v2 embeddings (384 dims, CPU-friendly)
    "pgvector>=0.3",                 # psycopg2 register_vector() adapter
    "numpy>=1.26",
    # Retrieval API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "openai>=1.30",                  # LLM client (OpenAI / any OpenAI-compatible endpoint)
    "anthropic>=0.40",               # Claude (Anthropic) LLM client
    "langgraph>=0.2",                # RAG orchestration graph
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
pipeline = "financial_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]   # line length enforced by formatter (line-length=130); SQL strings legitimately exceed it

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=financial_pipeline --cov-report=term-missing"
